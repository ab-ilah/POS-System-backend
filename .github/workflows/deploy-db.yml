# Schema deploy. Staging runs on every push to the staging branch.
# Production is manual (workflow_dispatch) from main and uses the production environment.
# GitHub cannot name the reviewer inside this file. Gabriel must set himself
# as a required reviewer on the production environment. See docs/branch-protection.md.
# This workflow does not load seed data.
# supabase CLI 3.0.0 accepts a database URL as --remote=<url>.
# The older database-url flag still runs, prints a deprecation warning, and is removed in v4.

name: Deploy database

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      target:
        description: Database to migrate
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-db-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: validate-dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject production dispatch off main
        if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production database deploy must be workflow_dispatch from branch main (refs/heads/main). Use workflow from main. Current ref is $GITHUB_REF."
          exit 1

      - name: Reject staging dispatch off staging
        if: inputs.target == 'staging' && github.ref != 'refs/heads/staging'
        run: |
          echo "::error::Staging database rerun must be workflow_dispatch from branch staging (refs/heads/staging). Use workflow from staging. Current ref is $GITHUB_REF."
          exit 1

  deploy-staging:
    name: deploy-staging
    needs: validate-dispatch
    if: >-
      !failure() && !cancelled() &&
      (needs.validate-dispatch.result == 'success' || needs.validate-dispatch.result == 'skipped') &&
      github.ref == 'refs/heads/staging' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'staging'))
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Push migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: npx supabase db push --yes --remote="$STAGING_DB_URL"

      - name: Disable hosted signup on staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: hnbvmxebzaocdttlteib
        run: npm run auth:disable-signup

  deploy-production:
    name: deploy-production
    # Manual only, and only from main. validate-dispatch fails wrong-ref workflow_dispatch.
    needs: validate-dispatch
    if: >-
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: npx supabase db push --yes --remote="$PROD_DB_URL"

      - name: Disable hosted signup on production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: vasbjwzykqoebbtvqnjx
        run: npm run auth:disable-signup
