# Schema deploy. Staging runs on every push to the staging branch.
# Production is manual (workflow_dispatch) from main and uses the production environment.
# GitHub cannot name the reviewer inside this file. Gabriel must set himself
# as a required reviewer on the production environment. See docs/branch-protection.md.
# This workflow does not load seed data.
# supabase CLI 3.0.0 accepts a database URL as --remote=<url>.
# The older database-url flag still runs, prints a deprecation warning, and is removed in v4.

name: Deploy database

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      target:
        description: Database to migrate
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-db-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: deploy-staging
    if: github.ref == 'refs/heads/staging' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging'))
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Push migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: npx supabase db push --yes --remote="$STAGING_DB_URL"

      - name: Disable hosted signup on staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: hnbvmxebzaocdttlteib
        run: npm run auth:disable-signup

  deploy-production:
    name: deploy-production
    # Manual only, and only from main. workflow_dispatch on any other ref does not run.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: npx supabase db push --yes --remote="$PROD_DB_URL"

      - name: Disable hosted signup on production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: vasbjwzykqoebbtvqnjx
        run: npm run auth:disable-signup
