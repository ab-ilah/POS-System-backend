# Nightly backup of production. Uploads only the age-encrypted dump.
# Do not add actions/upload-artifact. Plaintext is deleted inside the script.
# Runs in prod-ops (no required reviewer). Migrations stay on the production environment.

name: Backup database

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    name: backup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod-ops
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          age --version
          aws --version

      - name: Dump, encrypt, and upload
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_FORCE_PATH_STYLE: ${{ secrets.BACKUP_S3_FORCE_PATH_STYLE }}
          BACKUP_MIN_BYTES: ${{ secrets.BACKUP_MIN_BYTES }}
        run: bash scripts/backup-database.sh
